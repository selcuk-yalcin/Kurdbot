# LibreChat config — local chatbot via Ollama + optional Tavily
# Docs: https://www.librechat.ai/docs
#
# Local model (laptop-friendly): llama3.2:3b
# Later production model: kurdish-bot (from model-server/Modelfile + llama3.1:8b)

version: 1.2.1

cache: true

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "${OLLAMA_BASE_URL}/v1/"
      models:
        default:
          - "llama3.2:3b"
          - "kurdish-bot"
        fetch: true
      titleConvo: true
      titleModel: "llama3.2:3b"
      modelDisplayLabel: "Kurdish Bot (local)"
      dropParams:
        - "stop"
        - "user"

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "kurdish-local"
      label: "Kurd Bot (local) — llama3.2:3b"
      default: true
      preset:
        endpoint: "Ollama"
        model: "llama3.2:3b"
        system: |
          Tu asîstentekî Kurmancî yî.
          Bikarhêner bi kîjan zimanî binivîse jî, tu TENÊ bi Kurmancî (Kurdîya Bakur) bersivê didî.
          Heke tiştekî fêm nekî an jî nizanî, vê yekê jî bi Kurmancî bibêje.
          Heke agahiyên nû ji înternetê hewce bin, encamên lêgerînê bi Kurmancî kurt bike û rave bike.
          Tu caran bi Tirkî, Îngilîzî an zimanên din bersivê nede — tenê Kurmancî.

webSearch:
  searchProvider: "tavily"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"
