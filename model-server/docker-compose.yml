# OWNER: @cem-acun — Ollama ONLY (not part of the app compose)
#
# This file is Cem's responsibility. Do not merge into ../docker-compose.yml.
# Issue: https://github.com/selcuk-yalcin/Kurdbot/issues/21
#
# Local chatbot model: llama3.2:3b (~2 GB, laptop-friendly)
# Later production: kurdish-bot from Modelfile + llama3.1:8b (#7)
#
# Run FROM this directory (model-server/):
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:3b
#   curl http://localhost:11434/api/tags
#
# Then tell Selçuk / set in repo root .env:
#   OLLAMA_BASE_URL=http://host.docker.internal:11434

services:
  ollama:
    image: ollama/ollama:latest
    container_name: kurdbot-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./:/modelfile:ro
    # Optional NVIDIA GPU (uncomment if nvidia-container-toolkit is installed):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:
