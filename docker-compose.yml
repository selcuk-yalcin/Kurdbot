# Selçuk / app stack ONLY — LibreChat + MongoDB + Redis
# Ollama is NOT here. Cem owns Ollama → see model-server/docker-compose.yml (#21)
#
# Usage:
#   cp .env.example .env
#   # Set OLLAMA_BASE_URL to wherever Cem's Ollama is reachable
#   # e.g. http://host.docker.internal:11434  (Ollama on same PC)
#   docker compose up -d
#   open http://localhost:3080

services:
  librechat:
    image: ghcr.io/danny-avila/librechat-dev:latest
    container_name: kurdbot-librechat
    ports:
      - "${LIBRECHAT_PORT:-3080}:3080"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/LibreChat}
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - USE_REDIS=true
      - CONFIG_PATH=/app/librechat.yaml
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    extra_hosts:
      # Reach Ollama on the host machine (Cem's model-server compose)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: kurdbot-mongodb
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--noauth"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kurdbot-redis
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  librechat_images:
  librechat_uploads:
  librechat_logs:
