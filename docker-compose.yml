# Local full stack: LibreChat + MongoDB + Redis + Ollama
#
# Usage (on your PC):
#   cp .env.example .env          # fill JWT/CREDS (placeholders OK for local smoke test)
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:3b
#   open http://localhost:3080
#
# Local chatbot model: llama3.2:3b (~2 GB) — light enough for most laptops.
# Production later: kurdish-bot from model-server/Modelfile (llama3.1:8b).
#
# OLLAMA_BASE_URL for in-compose Ollama: http://ollama:11434

services:
  librechat:
    image: ghcr.io/danny-avila/librechat-dev:latest
    container_name: kurdbot-librechat
    ports:
      - "${LIBRECHAT_PORT:-3080}:3080"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/LibreChat}
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - USE_REDIS=true
      - CONFIG_PATH=/app/librechat.yaml
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: kurdbot-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./model-server:/modelfile:ro
    # Optional NVIDIA GPU (uncomment if you have nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: kurdbot-mongodb
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--noauth"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kurdbot-redis
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  ollama_data:
  librechat_images:
  librechat_uploads:
  librechat_logs:
